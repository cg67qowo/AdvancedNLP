<h3 id="reasoning-and-decomposition-2">Reasoning and Decomposition</h3>
<p><em>Thinking, Fast and Slow. [2]</em></p>
<ol>
<li><strong>System 1 reasoning</strong>: fast, automatic and unconscious; e.g. recognizing faces, taking quick decisions</li>
<li><strong>System 2 reasoning</strong>: slow, deliberate, analytical; e.g. solving maths problems</li>
</ol>
<p>System 1 is prone to <strong>cognitive biases</strong>, System 2 is <strong>rational</strong>. How do machines pass <strong>from System 1 to System 2?</strong></p>
<footer>Reasoning and decomposition</footer>
</section>

<h3 id="reinforcement-learning-recap-1">Reinforcement Learning Recap</h3>
<center><img width="600" src="../imgs/course10/rl_paradimg.jpg" /></center>
<small> 
<p>In reinforcement learning, an agent learns from the environment by interacting with it through trial and error and receiving rewards as feedback for performing actions.</p>
<p>The agent does not know the environment beforehand (black box): this is why it is a <strong>learning</strong> process.</p>
</small>
<footer>Reinforcement Learning Recap</footer>

<h3 id="reinforcement-learning">Reinforcement Learning</h3>
<ul>
<li> 
<p><strong>Environment</strong>, with which the agent interacts, outputs <strong>observations</strong> </li></p>
<li> 
<p>Agent makes <strong>decisions</strong> </li></p>
<li> 
<p>Agent gets new <strong>observations</strong> </li></p>
<li> 
<p>Agent gets a <strong>rewards</strong> based on how good (or bad) the actions were. </li></p>
</li>
</ul>

<h3 id="rlvr">RLVR</h3>
<p>The model is trained on tasks for which the correctness can be (easily) verified, either in an exact, mathematical way (formal proofs) or through executables (e.g. unit tests).</p>
<p>There is no uniform way of defining a task as verifiable; for example, mathematical proofs are (intuitively) among the most robustly verifiable tasks.</p>
<footer>Training for Reasoning</footer>
</section>
